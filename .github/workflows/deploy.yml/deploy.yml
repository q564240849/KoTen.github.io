name: Build and deploy Hexo blog

on:
  push:
    branches: [hexo]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Fetch zhaoo theme (pinned)
        run: |
          git clone https://github.com/zhaoo/hexo-theme-zhaoo.git themes/zhaoo
          git -C themes/zhaoo checkout fa74effbcc0f07d029afcf1bf312328eca708f7a
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate site
        run: npx hexo generate
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
